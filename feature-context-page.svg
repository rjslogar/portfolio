  <!-- ===== Main content ===== -->
  <text x="183" y="53" font-size="8" fill="#666"><tspan fill="#1F5BC4">Conviva Integration</tspan> &gt; DPI Integration Overview</text>

  <rect x="180.5" y="69.5" width="645" height="28" rx="4" fill="#F4EFF7" stroke="#7A4E9A"/>
  <text x="187" y="89" font-size="16" fill="#1E1E1E">Conviva DPI Sensor Integration</text>

  <g font-size="7.6" fill="#222">
    <text x="183" y="117">Conviva Digital Product Insights (DPI) sensor data ingest applies a lightweight integration to your application platforms, enabling automatic, semantic-less data collection across</text>
    <text x="183" y="129">different data sources and formats, with heavy computation done on the server-side.</text>
    <circle cx="187" cy="144.5" r="1.4"/>
    <text x="193" y="147">Automatically collect system level events (clicks, network requests, crashes, errors, video player events, device and OS metadata, etc.)</text>
    <circle cx="187" cy="162.5" r="1.4"/>
    <text x="193" y="165">With semantic-less collection, send all custom events with a single integration without having to reformat events to map to a pre-defined schema</text>
    <circle cx="187" cy="180.5" r="1.4"/>
    <text x="193" y="183">Ingest data across all application platforms (Web, mobile, tablet, TV, STB, AR/VR, smart speaker, car, etc.)</text>
    <text x="183" y="203">Go to <tspan fill="#1F5BC4">Conviva GitHub</tspan> repositories with basic README instructions or leverage the UI integration tool for guided data ingest.</text>
    <text x="183" y="221">Browse the <tspan fill="#1F5BC4">DPI Integration FAQs</tspan>, view the platform summary diagrams, watch this integration video.</text>
  </g>

